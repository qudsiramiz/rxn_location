site_name: rxn_location
site_url: https://qudsiramiz.github.io/rxn_location/
repo_url: https://github.com/qudsiramiz/rxn_location

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  palette:
    scheme: default
    primary: indigo
    accent: indigo

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true

nav:
  - Home: index.md
  - API Reference: api.md
