[tool.poetry]
name = "rxn_location"
version = "0.3.0"
description = "Statistical comparison between X-line location predicted by various models for dayside terrestrial magnetopause"
authors = ["Ramiz Qudsi <qudsiramiz@gmail.com>"]
license = "GNU GENERAL PUBLIC LICENSE, Version 3, 29 June 2007"
packages = [{include = "rxn_location", from = "src"}]
readme = "README.md"
repository = "https://github.com/qudsiramiz/rxn_location"
documentation = "https://qudsiramiz.github.io/rxn_location/"
include = ["data/potential_jet_reconnection_times.txt", "sample_files/*"]

[tool.poetry.scripts]
rxn-location-gui = "rxn_location.gui:run"
rxn-batch = "rxn_location.batch_statistics_cli:main"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
spacepy = ">=0.7.0"
pyspedas = ">=2.1.3"
tabulate = ">=0.9.0"
trjtrypy = ">=0.0.0"
joblib = ">=1.3.1"
ipython = ">=9.15.0"
h5py = ">=3.9.0"
scikit-image = ">=0.26.0"
more-itertools = ">=11.1.0"
seaborn = ">=0.13.2"
matplotlib = ">=3.11.0"
plotly = ">=6.9.0"
streamlit = ">=1.59.2"
kaleido = ">=1.3.0"
pytz = ">=2026.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
mkdocs-material = "^9.5.0"
mkdocstrings = {extras = ["python"], version = "^1.0.6"}
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
