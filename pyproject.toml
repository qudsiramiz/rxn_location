[tool.poetry]
name = "rxn_location"
version = "0.1.0"
description = "Statistical comparison between X-line location predicted by various models for dayside terrestrial magnetopause"
authors = ["Ramiz Qudsi <qudsiramiz@gmail.com>"]
license = "GNU GENERAL PUBLIC LICENSE, Version 3, 29 June 2007"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
spacepy = "^0.7.0"
pyspedas = "^2.1.3"
tabulate = "^0.9.0"
trjtrypy = "^0.0.0"
joblib = "^1.3.1"
ipython = "^9.15.0"
h5py = "^3.9.0"
scikit-image = "^0.26.0"
more-itertools = "^11.1.0"
seaborn = "^0.13.2"
matplotlib = "^3.11.0"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
